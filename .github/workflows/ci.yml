# Test gate: runs on every PR and on every push to main.
# Gives "Require status checks to pass" in branch protection a check to
# require, and turns merged-PR regressions red before they land.
# No publish logic here — publishing is exclusively .github/workflows/publish.yml
# (tag-triggered, OIDC).
name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
